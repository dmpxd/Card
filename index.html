<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Tape Tap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=JetBrains+Mono:wght@400;700&display=swap');

  :root{
    --bg-deep:#160e1a;
    --bg-panel:#26192e;
    --cream:#f4ecd8;
    --amber:#f2a93b;
    --magenta:#d1477a;
    --teal:#3fb8af;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-deep);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(242,169,59,0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(209,71,122,0.08), transparent 40%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono', monospace;
    color:var(--cream);
    padding:20px;
    -webkit-tap-highlight-color:transparent;
  }

  .deck{
    width:100%;
    max-width:420px;
    background:var(--bg-panel);
    border-radius:18px;
    padding:18px 18px 22px;
    border:2px solid #3a2a44;
    position:relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  .deck-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:12px;
  }

  .logo{
    font-family:'Rubik Mono One', sans-serif;
    font-size:22px;
    letter-spacing:1px;
    color:var(--amber);
    margin:0;
    line-height:1;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }

  .logo span{ color:var(--magenta); }

  .counter-box{
    text-align:right;
  }

  .counter-label{
    font-size:9px;
    letter-spacing:2px;
    color:#8a7a92;
    display:block;
    margin-bottom:2px;
  }

  .counter-digits{
    background:#0e0912;
    color:var(--teal);
    font-weight:700;
    font-size:18px;
    letter-spacing:3px;
    padding:4px 8px;
    border-radius:4px;
    border:1px solid #3a2a44;
    min-width:80px;
  }

  .cassette{
    background:#1c1220;
    border:1px solid #3a2a44;
    border-radius:12px;
    padding:10px 14px 14px;
    margin-bottom:14px;
  }

  .reel-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 10px;
  }

  .reel{
    width:52px;
    height:52px;
    border-radius:50%;
    background: repeating-conic-gradient(#0e0912 0deg 8deg, #241a2b 8deg 16deg);
    border:3px solid #46334f;
    position:relative;
    animation: spin var(--spin-dur, 6s) linear infinite;
  }

  .reel::after{
    content:'';
    position:absolute;
    inset:18px;
    background:var(--bg-panel);
    border-radius:50%;
    border:2px solid #46334f;
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  .tape-strip{
    flex:1;
    height:6px;
    background:linear-gradient(90deg, #46334f, #2a1e31, #46334f);
    margin:0 8px;
    border-radius:3px;
  }

  .health-row{
    display:flex;
    gap:5px;
    justify-content:center;
    margin-top:10px;
  }

  .health-seg{
    width:36px;
    height:8px;
    border-radius:2px;
    background:#3a2a44;
    transition: background .2s;
  }

  .health-seg.on{ background:var(--amber); }

  .combo-line{
    text-align:center;
    height:20px;
    font-size:13px;
    font-weight:700;
    color:var(--magenta);
    letter-spacing:1px;
    margin-bottom:4px;
  }

  .lanes{
    display:flex;
    gap:6px;
    height:340px;
    position:relative;
    background:#100a13;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #3a2a44;
  }

  .lane{
    flex:1;
    position:relative;
    border-right:1px solid #241a2b;
  }
  .lane:last-child{ border-right:none; }

  .hit-line{
    position:absolute;
    left:0; right:0;
    top:82%;
    height:3px;
    background:var(--cream);
    opacity:0.5;
  }

  .note{
    position:absolute;
    left:8%;
    right:8%;
    height:22px;
    border-radius:5px;
    top:-24px;
  }

  .float-txt{
    position:absolute;
    left:50%;
    top:82%;
    transform:translate(-50%,-50%);
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    pointer-events:none;
    animation: floatUp .5s ease-out forwards;
  }

  @keyframes floatUp{
    0%{ opacity:1; transform:translate(-50%,-50%); }
    100%{ opacity:0; transform:translate(-50%,-140%); }
  }

  .tap-zones{
    display:flex;
    gap:6px;
    margin-top:8px;
  }

  .tap-zone{
    flex:1;
    height:56px;
    border-radius:8px;
    border:none;
    background:#241a2b;
    color:var(--cream);
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:16px;
    letter-spacing:1px;
    touch-action:none;
    user-select:none;
    transition: transform .06s, background .06s;
  }

  .tap-zone:active{ transform:scale(0.94); }

  .tap-zone.flash{ transform:scale(0.94); }

  .tap-zone:focus-visible{ outline:2px solid var(--cream); outline-offset:2px; }

  .overlay{
    position:absolute;
    inset:0;
    background:rgba(14,9,18,0.94);
    border-radius:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    gap:12px;
  }

  .overlay h2{
    font-family:'Rubik Mono One', sans-serif;
    color:var(--amber);
    font-size:20px;
    margin:0;
  }

  .overlay p{
    color:#b8a9c0;
    font-size:13px;
    line-height:1.6;
    max-width:280px;
    margin:0;
  }

  .overlay .final{
    font-size:26px;
    color:var(--teal);
    font-weight:700;
  }

  .play-btn{
    margin-top:8px;
    background:var(--amber);
    color:#2a1a05;
    border:none;
    font-family:'Rubik Mono One', sans-serif;
    font-size:14px;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
  }
  .play-btn:active{ transform:scale(0.97); }

  .keys-hint{
    display:flex;
    gap:10px;
    margin-top:4px;
  }
  .keys-hint span{
    background:#241a2b;
    border:1px solid #46334f;
    padding:3px 8px;
    border-radius:4px;
    font-size:11px;
  }

  @media (prefers-reduced-motion: reduce){
    .reel{ animation:none; }
    .float-txt{ animation:none; }
  }
</style>
</head>
<body>

<div class="deck">
  <div class="deck-header">
    <h1 class="logo">TAPE<span>·</span>TAP</h1>
    <div class="counter-box">
      <span class="counter-label">COUNTER</span>
      <div class="counter-digits" id="counter">0000</div>
    </div>
  </div>

  <div class="cassette">
    <div class="reel-row">
      <div class="reel" id="reelL"></div>
      <div class="tape-strip"></div>
      <div class="reel" id="reelR"></div>
    </div>
    <div class="health-row" id="healthRow"></div>
  </div>

  <div class="combo-line" id="comboLine"></div>

  <div class="lanes" id="lanes">
    <div class="hit-line"></div>
    <div class="lane" data-lane="0"></div>
    <div class="lane" data-lane="1"></div>
    <div class="lane" data-lane="2"></div>
    <div class="lane" data-lane="3"></div>

    <div class="overlay" id="overlay">
      <h2>TAPE TAP</h2>
      <p>Tap the buttons in time with the notes as they hit the line. Keep the tape from snapping — miss too many and it's over.</p>
      <div class="keys-hint">
        <span>Q</span><span>W</span><span>E</span><span>R</span>
      </div>
      <button class="play-btn" id="playBtn">▶ PRESS PLAY</button>
    </div>
  </div>

  <div class="tap-zones" id="tapZones">
    <button class="tap-zone" data-lane="0" style="color:var(--amber)">Q</button>
    <button class="tap-zone" data-lane="1" style="color:var(--magenta)">W</button>
    <button class="tap-zone" data-lane="2" style="color:var(--teal)">E</button>
    <button class="tap-zone" data-lane="3" style="color:var(--cream)">R</button>
  </div>
</div>

<script>
(function(){
  const LANE_COLORS = ['#f2a93b','#d1477a','#3fb8af','#f4ecd8'];
  const LANE_KEYS = ['q','w','e','r'];
  const NOTE_TRAVEL_MS = 1500;
  const HIT_RATIO = 0.82;
  const MAX_HEALTH = 5;
  const PERFECT_MS = 80;
  const GOOD_MS = 200;
  const OUTER_MS = 260;

  const lanesEl = document.getElementById('lanes');
  const laneEls = Array.from(document.querySelectorAll('.lane'));
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');
  const counterEl = document.getElementById('counter');
  const comboLine = document.getElementById('comboLine');
  const healthRow = document.getElementById('healthRow');
  const reelL = document.getElementById('reelL');
  const reelR = document.getElementById('reelR');
  const tapZones = Array.from(document.querySelectorAll('.tap-zone'));

  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }
  function playTone(freq, dur, type){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }
  const LANE_FREQ = [330, 392, 440, 523];
  function hitSound(lane, quality){
    const base = LANE_FREQ[lane];
    if(quality === 'perfect') playTone(base * 1.5, 0.14, 'square');
    else if(quality === 'good') playTone(base, 0.12, 'square');
  }
  function missSound(){ playTone(110, 0.18, 'sawtooth'); }
  function reviveSound(){ playTone(660, 0.1, 'sine'); setTimeout(()=>playTone(880,0.15,'sine'),90); }

  let state;
  function freshState(){
    return {
      running:false,
      startTime:0,
      score:0,
      combo:0,
      bestCombo:0,
      health:MAX_HEALTH,
      bpm:100,
      hitsSinceRamp:0,
      nextSpawn:0,
      notes:[],
      noteId:0,
      lastFrame:0
    };
  }

  function buildHealth(){
    healthRow.innerHTML = '';
    for(let i=0;i<MAX_HEALTH;i++){
      const seg = document.createElement('div');
      seg.className = 'health-seg';
      healthRow.appendChild(seg);
    }
  }
  function renderHealth(){
    const segs = healthRow.children;
    for(let i=0;i<segs.length;i++){
      segs[i].classList.toggle('on', i < state.health);
    }
  }

  function renderCounter(){
    counterEl.textContent = String(state.score).padStart(4,'0');
  }

  function setSpinSpeed(){
    const dur = Math.max(1.4, 6 * (100 / state.bpm));
    reelL.style.setProperty('--spin-dur', dur + 's');
    reelR.style.setProperty('--spin-dur', (dur*0.9) + 's');
  }

  function spawnNote(){
    const lane = Math.floor(Math.random()*4);
    const note = {
      id: state.noteId++,
      lane,
      spawnTime: performance.now(),
      hit:false,
      el:null
    };
    const el = document.createElement('div');
    el.className = 'note';
    el.style.background = LANE_COLORS[lane];
    el.style.boxShadow = '0 0 0 1px rgba(0,0,0,0.3)';
    laneEls[lane].appendChild(el);
    note.el = el;
    state.notes.push(note);
  }

  function scheduleNextSpawn(now){
    const interval = 60000 / state.bpm;
    const variance = Math.random() < 0.25 ? interval/2 : interval;
    state.nextSpawn = now + variance;
  }

  function floatText(lane, text, color){
    const f = document.createElement('div');
    f.className = 'float-txt';
    f.textContent = text;
    f.style.color = color;
    laneEls[lane].appendChild(f);
    setTimeout(()=>f.remove(), 500);
  }

  function comboMultiplier(){
    return 1 + Math.floor(state.combo/10)*0.5;
  }

  function registerHit(lane){
    if(!state.running) return;
    const now = performance.now();
    let best = null, bestDiff = Infinity;
    for(const n of state.notes){
      if(n.lane !== lane || n.hit) continue;
      const hitTime = n.spawnTime + NOTE_TRAVEL_MS;
      const diff = Math.abs(now - hitTime);
      if(diff < bestDiff){ bestDiff = diff; best = n; }
    }
    flashZone(lane);
    if(best && bestDiff <= OUTER_MS){
      best.hit = true;
      best.el.remove();
      state.notes = state.notes.filter(n=>n!==best);
      let quality, points, color;
      if(bestDiff <= PERFECT_MS){ quality='perfect'; points=100; color='var(--teal)'; }
      else { quality='good'; points=50; color='var(--amber)'; }
      state.combo++;
      state.bestCombo = Math.max(state.bestCombo, state.combo);
      state.score += Math.round(points * comboMultiplier());
      state.hitsSinceRamp++;
      hitSound(lane, quality);
      floatText(lane, quality==='perfect' ? 'PERFECT' : 'GOOD', color);
      if(state.combo>0 && state.combo % 20 === 0 && state.health < MAX_HEALTH){
        state.health++;
        reviveSound();
        floatText(lane, 'TAPE RESTORED', 'var(--cream)');
      }
      if(state.hitsSinceRamp >= 15 && state.bpm < 220){
        state.bpm += 10;
        state.hitsSinceRamp = 0;
        setSpinSpeed();
      }
      renderCounter();
      renderHealth();
      updateCombo();
    }
  }

  function flashZone(lane){
    const zone = tapZones[lane];
    zone.classList.add('flash');
    setTimeout(()=>zone.classList.remove('flash'), 90);
  }

  function updateCombo(){
    comboLine.textContent = state.combo >= 3 ? (state.combo + ' COMBO') : '';
  }

  function missNote(n){
    n.el.remove();
    state.notes = state.notes.filter(x=>x!==n);
    state.combo = 0;
    state.health--;
    missSound();
    floatText(n.lane, 'MISS', 'var(--magenta)');
    updateCombo();
    renderHealth();
    if(state.health <= 0){
      endGame();
    }
  }

  function laneHeight(){
    return laneEls[0].clientHeight;
  }

  let rafId;
  function tick(now){
    if(!state.running) return;
    if(now >= state.nextSpawn){
      spawnNote();
      scheduleNextSpawn(now);
    }
    const lh = laneHeight();
    for(const n of state.notes.slice()){
      const progress = (now - n.spawnTime) / NOTE_TRAVEL_MS;
      if(progress >= 1.05){
        missNote(n);
        continue;
      }
      const top = progress * HIT_RATIO * lh;
      n.el.style.top = top + 'px';
    }
    rafId = requestAnimationFrame(tick);
  }

  function startGame(){
    ensureAudio();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    state = freshState();
    buildHealth();
    renderHealth();
    renderCounter();
    updateCombo();
    setSpinSpeed();
    laneEls.forEach(l=>{ l.querySelectorAll('.note, .float-txt').forEach(e=>e.remove()); });
    overlay.style.display = 'none';
    state.running = true;
    const now = performance.now();
    state.nextSpawn = now + 300;
    rafId = requestAnimationFrame(tick);
  }

  function endGame(){
    state.running = false;
    cancelAnimationFrame(rafId);
    laneEls.forEach(l=>{ l.querySelectorAll('.note').forEach(e=>e.remove()); });
    overlay.innerHTML = `
      <h2>TAPE SNAPPED</h2>
      <div class="final">${String(state.score).padStart(4,'0')}</div>
      <p>Best combo: ${state.bestCombo}. Rewind and give it another spin.</p>
      <button class="play-btn" id="playBtn2">▶ REWIND &amp; REPLAY</button>
    `;
    overlay.style.display = 'flex';
    document.getElementById('playBtn2').addEventListener('click', startGame);
  }

  playBtn.addEventListener('click', startGame);

  tapZones.forEach(zone=>{
    zone.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      registerHit(parseInt(zone.dataset.lane,10));
    });
  });

  window.addEventListener('keydown', (e)=>{
    if(e.repeat) return;
    const idx = LANE_KEYS.indexOf(e.key.toLowerCase());
    if(idx !== -1){
      registerHit(idx);
      flashZone(idx);
    }
  });

  state = freshState();
  buildHealth();
  renderHealth();
  renderCounter();
})();
</script>

</body>
</html>
