<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — a worldly connections game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #16232B;
    --ink-2: #1F323C;
    --ink-3: #294050;
    --parchment: #EFE6D3;
    --parchment-2: #E4D8BE;
    --brass: #C29A5B;
    --brass-dim: #8C723F;
    --text-light: #F3ECDD;
    --text-dark: #1D2A2E;
    --tier-1: #C1666B; /* coastline - easiest */
    --tier-2: #7C9885; /* lowland */
    --tier-3: #4C7C93; /* deepwater */
    --tier-4: #6B4E71; /* summit - hardest */
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(194,154,91,0.10), transparent 60%),
      radial-gradient(ellipse 900px 600px at 110% 10%, rgba(76,124,147,0.14), transparent 60%),
      var(--ink);
    color: var(--text-light);
    font-family: 'Space Grotesk', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 16px 60px;
  }

  .meridian-lines{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;
  }

  .wrap{ position:relative; z-index:1; width:100%; max-width:560px; }

  header{ text-align:center; margin-bottom: 22px; }
  .eyebrow{
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 8px; font-weight:600;
  }
  h1{
    font-family:'Fraunces', serif; font-optical-sizing:auto;
    font-weight:600; font-size: clamp(34px, 8vw, 46px);
    margin: 0 0 6px; letter-spacing: 0.01em;
  }
  h1 em{ font-style: italic; font-weight:400; color: var(--brass); }
  .sub{ font-size: 14px; color: rgba(243,236,221,0.65); max-width: 420px; margin: 0 auto; line-height:1.5;}

  .puzzle-title{
    text-align:center; margin: 18px 0 14px;
    font-family:'Fraunces', serif; font-size: 16px; color: var(--text-light);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .puzzle-title::before, .puzzle-title::after{
    content:''; flex:1; height:1px; max-width:70px;
    background: linear-gradient(90deg, transparent, var(--brass-dim), transparent);
  }

  .solved-row{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius: 10px; padding: 14px 10px; margin-bottom: 10px;
    animation: reveal 0.45s ease;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  @keyframes reveal{
    from{ transform: scale(0.9) translateY(-6px); opacity:0; }
    to{ transform: scale(1) translateY(0); opacity:1; }
  }
  .solved-row .cat-name{
    font-family:'Fraunces', serif; font-weight:700; font-size: 15px; letter-spacing:0.03em;
    text-transform: uppercase; margin-bottom: 3px;
  }
  .solved-row .cat-words{ font-size: 13px; letter-spacing:0.02em; opacity:0.92; }

  .tier-1{ background: var(--tier-1); color: #2A1315; }
  .tier-2{ background: var(--tier-2); color: #16241A; }
  .tier-3{ background: var(--tier-3); color: #0E1E27; }
  .tier-4{ background: var(--tier-4); color: #F3ECDD; }

  .grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 18px;
  }

  .tile{
    aspect-ratio: 1.28 / 1;
    background: var(--parchment);
    color: var(--text-dark);
    border: none; border-radius: 8px;
    font-family:'Space Grotesk', sans-serif;
    font-weight: 600; font-size: clamp(11.5px, 3.1vw, 14.5px);
    text-transform: uppercase; letter-spacing: 0.01em;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding: 6px; cursor:pointer; line-height:1.15; overflow-wrap: break-word; hyphens: auto;
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    user-select:none;
  }
  .tile:hover{ background: var(--parchment-2); }
  .tile:active{ transform: scale(0.97); }
  .tile.selected{
    background: var(--ink-3); color: var(--text-light);
    box-shadow: 0 0 0 2px var(--brass) inset;
    transform: translateY(-2px);
  }
  .tile.shake{ animation: shake 0.4s ease; }
  @keyframes shake{
    10%,90%{ transform: translateX(-2px);} 20%,80%{ transform: translateX(4px);}
    30%,50%,70%{ transform: translateX(-6px);} 40%,60%{ transform: translateX(6px);}
  }
  .tile.pop-out{ animation: popOut 0.35s ease forwards; }
  @keyframes popOut{ to{ opacity:0; transform: scale(0.4); } }

  .status-row{
    display:flex; align-items:center; justify-content:center;
    gap: 10px; margin-bottom: 16px; min-height: 20px;
    font-size: 13px; color: rgba(243,236,221,0.75);
  }
  .status-row .msg{ font-weight:600; color: var(--brass); }

  .mistakes{ display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom: 20px; }
  .mistakes .label{ font-size: 12px; letter-spacing:0.06em; text-transform:uppercase; color: rgba(243,236,221,0.55);}
  .dots{ display:flex; gap:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; background: var(--brass); transition: opacity 0.2s, transform 0.2s; }
  .dot.spent{ background: transparent; box-shadow: inset 0 0 0 1.5px rgba(243,236,221,0.35); }

  .controls{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button.pill{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px;
    letter-spacing: 0.03em; text-transform: uppercase;
    padding: 10px 20px; border-radius: 999px; cursor:pointer;
    border: 1.5px solid var(--brass-dim); background: transparent; color: var(--text-light);
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  button.pill:hover{ background: rgba(194,154,91,0.12); border-color: var(--brass); }
  button.pill:disabled{ opacity:0.35; cursor:not-allowed; }
  button.pill.primary{ background: var(--brass); color: var(--ink); border-color: var(--brass); }
  button.pill.primary:hover{ background: #d3ab6c; }

  .footer-row{ display:flex; justify-content:center; margin-top: 22px; }
  .new-game-link{
    font-size: 12px; color: rgba(243,236,221,0.5); text-decoration:underline;
    text-underline-offset:3px; cursor:pointer; background:none; border:none; font-family:inherit;
  }
  .new-game-link:hover{ color: var(--brass); }

  .overlay{
    position:fixed; inset:0; background: rgba(10,16,20,0.72); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; z-index: 10;
    opacity:0; pointer-events:none; transition: opacity 0.25s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    background: var(--ink-2); border: 1px solid var(--brass-dim); border-radius: 14px;
    padding: 30px 26px; max-width: 380px; width: calc(100% - 40px); text-align:center;
    transform: translateY(8px); transition: transform 0.25s;
  }
  .overlay.show .modal{ transform: translateY(0); }
  .modal h2{ font-family:'Fraunces', serif; font-size: 24px; margin: 0 0 8px; }
  .modal p{ font-size: 13.5px; color: rgba(243,236,221,0.7); line-height:1.5; margin: 0 0 18px; }
  .modal .modal-buttons{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  @media (max-width: 380px){
    .tile{ font-size: 10.5px; }
  }
</style>
</head>

<svg class="meridian-lines" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <g fill="none" stroke="#C29A5B" stroke-width="0.6">
    <ellipse cx="400" cy="400" rx="80" ry="380" />

  </header>

  <div id="solvedContainer"></div>
  <div class="grid" id="grid"></div>

  <div class="mistakes">
    <span class="label">Mistakes remaining</span>
    <span class="dots" id="dots"></span>
  </div>

  <div class="controls">
    <button class="pill" id="shuffleBtn">Shuffle</button>
    <button class="pill" id="deselectBtn">Deselect</button>
    <button class="pill" id="submitBtn">Submit</button>
  </div>

  <div class="footer-row">
    <button class="new-game-link" id="newPuzzleBtn">Start a different puzzle →</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Solved it!</h2>
    <p id="modalText">You found every group. Nicely done.</p>
    <div class="modal-buttons">
      <button class="pill" id="modalReplay">Replay this board</button>
      <button class="pill primary" id="modalNew">New puzzle</button>
    </div>
  </div>
</div>

const MAX_MISTAKES = 4;

// ---------- State ----------
let state = {
  puzzleIndex: null,
  tiles: [],        // array of {word, tier}
  selected: [],      // array of word strings
  solvedTiers: [],   // tiers already solved
  mistakesLeft: MAX_MISTAKES,
  wrongGuesses: [],  // stringified sorted combos already tried
  gameOver: false,
};

let lastPuzzleIndex = -1;

function pickPuzzleIndex(){
  if (PUZZLES.length === 1) return 0;
  let idx;
  do { idx = Math.floor(Math.random() * PUZZLES.length); } while (idx === lastPuzzleIndex);
  lastPuzzleIndex = idx;
  return idx;
}

function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startPuzzle(index){
  const puzzle = PUZZLES[index];
  const tiles = [];
  puzzle.categories.forEach(cat => {
    cat.words.forEach(w => tiles.push({ word: w, tier: cat.tier }));
  });
  state = {
    puzzleIndex: index,
    tiles: shuffleArray(tiles),
    selected: [],
    solvedTiers: [],
    mistakesLeft: MAX_MISTAKES,
    wrongGuesses: [],
    gameOver: false,
  };
  document.getElementById('puzzleTitle').textContent = puzzle.title;
  hideOverlay();
  setStatus('');
  render();
}

function newRandomPuzzle(){ startPuzzle(pickPuzzleIndex()); }
function replaySamePuzzle(){ startPuzzle(state.puzzleIndex); }

// ---------- Rendering ----------
function render(){
  renderSolved();
  renderGrid();
  renderDots();
  updateButtons();
}

function renderSolved(){
  const container = document.getElementById('solvedContainer');
  container.innerHTML = '';
  const puzzle = PUZZLES[state.puzzleIndex];
  state.solvedTiers.forEach(tier => {
    const cat = puzzle.categories.find(c => c.tier === tier);
    const row = document.createElement('div');
    row.className = `solved-row ${TIER_CLASS[tier]}`;
    row.innerHTML = `<div class="cat-name">${cat.name}</div><div class="cat-words">${cat.words.join(' · ')}</div>`;
    container.appendChild(row);
  });
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const remaining = state.tiles.filter(t => !state.solvedTiers.includes(t.tier));
  remaining.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tile';
    btn.textContent = t.word;
    if (state.selected.includes(t.word)) btn.classList.add('selected');
    btn.disabled = state.gameOver;
    btn.addEventListener('click', () => toggleTile(t.word));
    grid.appendChild(btn);
  });
}

function renderDots(){
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < MAX_MISTAKES; i++){
    const d = document.createElement('span');
    d.className = 'dot' + (i >= state.mistakesLeft ? ' spent' : '');
    dotsEl.appendChild(d);
  }
}

function updateButtons(){
  document.getElementById('submitBtn').disabled = state.selected.length !== 4 || state.gameOver;
  document.getElementById('deselectBtn').disabled = state.selected.length === 0 || state.gameOver;
  document.getElementById('shuffleBtn').disabled = state.gameOver;
}

function setStatus(msg){
  const row = document.getElementById('statusRow');
  row.innerHTML = msg ? `<span class="msg">${msg}</span>` : '&nbsp;';
}

// ---------- Interaction ----------
function toggleTile(word){
  if (state.gameOver) return;
  const idx = state.selected.indexOf(word);
  if (idx > -1){
    state.selected.splice(idx, 1);
  } else {
    if (state.selected.length >= 4) return;
    state.selected.push(word);
  }
  setStatus('');
  render();
}

function shuffleRemaining(){
  const remainingWords = state.tiles.filter(t => !state.solvedTiers.includes(t.tier));
  const solvedWords = state.tiles.filter(t => state.solvedTiers.includes(t.tier));
  state.tiles = solvedWords.concat(shuffleArray(remainingWords));
  render();
}

function deselectAll(){
  state.selected = [];
  render();
}

function submitGuess(){
  if (state.selected.length !== 4 || state.gameOver) return;
  const puzzle = PUZZLES[state.puzzleIndex];
  const guessedTiles = state.selected.map(w => state.tiles.find(t => t.word === w));
  const tiers = guessedTiles.map(t => t.tier);
  const uniqueTiers = new Set(tiers);
  const comboKey = state.selected.slice().sort().join('|');

  if (state.wrongGuesses.includes(comboKey)){
    setStatus('Already tried that combination');
    return;
  }

  if (uniqueTiers.size === 1){
    // correct
    const tier = tiers[0];
    state.solvedTiers.push(tier);
    state.selected = [];
    setStatus('');
    render();
    if (state.solvedTiers.length === puzzle.categories.length){
      state.gameOver = true;
      setTimeout(() => showEndModal(true), 400);
    }
    return;
  }

  // wrong guess
  state.wrongGuesses.push(comboKey);
  state.mistakesLeft -= 1;

  const oneAway = tierCountsHasThreeMatch(tiers);
  shakeSelected();

  setTimeout(() => {
    state.selected = [];
    if (state.mistakesLeft <= 0){
      state.gameOver = true;
      render();
      setStatus('');
      setTimeout(() => showEndModal(false), 300);
    } else {
      render();
      setStatus(oneAway ? 'One away…' : 'Not quite — try again');
    }
  }, 420);
}

function tierCountsHasThreeMatch(tiers){
  const counts = {};
  tiers.forEach(t => counts[t] = (counts[t] || 0) + 1);
  return Object.values(counts).some(c => c === 3);
}

function shakeSelected(){
  const grid = document.getElementById('grid');
  [...grid.children].forEach(btn => {
    if (state.selected.includes(btn.textContent)) btn.classList.add('shake');
  });
}

function showEndModal(won){
  const puzzle = PUZZLES[state.puzzleIndex];
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('modalTitle');
  const text = document.getElementById('modalText');
  if (won){
    title.textContent = 'Solved it!';
    const missed = MAX_MISTAKES - state.mistakesLeft;
    text.textContent = missed === 0
      ? `Perfect run through "${puzzle.title}" — no mistakes.`
      : `You cleared "${puzzle.title}" with ${missed} mistake${missed === 1 ? '' : 's'}.`;
  } else {
    title.textContent = 'Out of guesses';
    text.textContent = `That was "${puzzle.title}." Here's how the board breaks down:`;
    // reveal remaining categories
    puzzle.categories.forEach(c => {
      if (!state.solvedTiers.includes(c.tier)) state.solvedTiers.push(c.tier);
    });
    render();
  }
  overlay.classList.add('show');
}

function hideOverlay(){
  document.getElementById('overlay').classList.remove('show');
}

// ---------- Wire up ----------
document.getElementById('shuffleBtn').addEventListener('click', shuffleRemaining);
document.getElementById('deselectBtn').addEventListener('click', deselectAll);
document.getElementById('submitBtn').addEventListener('click', submitGuess);
document.getElementById('newPuzzleBtn').addEventListener('click', newRandomPuzzle);
document.getElementById('modalReplay').addEventListener('click', replaySamePuzzle);
document.getElementById('modalNew').addEventListener('click', newRandomPuzzle);

newRandomPuzzle();
</script>
</body>
</html>
