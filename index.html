<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pop Streak — Bubble Shooter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --bg-deep: #0c0f21;
    --bg-mid: #171b38;
    --panel: #1c2145;
    --panel-line: #2c3266;
    --gold: #F5B700;
    --gold-soft: #FFD866;
    --lavender: #C7CEEA;
    --lavender-dim: #8892c2;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #2a2f66 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    font-family:'Nunito', sans-serif;
    color: var(--lavender);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow-x:hidden;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }

  #app{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 14px 10px 20px;
    width:100%;
    max-width:460px;
  }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:0.5px;
    margin:2px 0 10px;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow: 0 2px 12px rgba(245,183,0,0.25);
  }

  .hud{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background: var(--panel);
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:10px 16px;
    margin-bottom:10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .hud-block{ text-align:center; }
  .hud-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color: var(--lavender-dim);
    font-weight:700;
  }
  .hud-value{
    font-family:'Baloo 2', sans-serif;
    font-size:22px;
    font-weight:700;
    color: var(--lavender);
    line-height:1.1;
  }
  .hud-value.gold{ color: var(--gold-soft); }
  .hud-value.turns-low{ color: #F4475E; animation: pulse-turn 0.9s infinite; }

  @keyframes pulse-turn{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }

  #board-wrap{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 1px var(--panel-line);
    background: radial-gradient(ellipse at 50% 0%, #232a56 0%, #10132a 75%);
  }

  canvas{ display:block; touch-action:none; }

  .next-preview{
    position:absolute;
    top:8px; right:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    background:rgba(12,15,33,0.55);
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:5px 7px;
    font-size:9px;
    color:var(--lavender-dim);
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:700;
  }
  .next-dot{
    width:16px; height:16px; border-radius:50%;
    box-shadow: inset -2px -2px 4px rgba(0,0,0,0.35), inset 2px 2px 3px rgba(255,255,255,0.4);
  }

  .legend{
    display:flex;
    gap:10px;
    margin-top:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .legend-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:20px;
    padding:5px 10px 5px 6px;
    font-size:11px;
    font-weight:700;
    color:var(--lavender-dim);
    cursor:help;
  }
  .legend-orb{
    width:20px;height:20px;border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
    flex-shrink:0;
    box-shadow: inset -2px -2px 4px rgba(0,0,0,0.4), inset 2px 2px 3px rgba(255,255,255,0.5);
  }
  .tooltip{
    position:absolute;
    bottom:130%;
    left:50%;
    transform:translateX(-50%) translateY(6px);
    width:180px;
    background:#0c0f21;
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:8px 10px;
    font-size:11px;
    font-weight:600;
    line-height:1.4;
    color:var(--lavender);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.15s ease, transform 0.15s ease;
    box-shadow:0 8px 20px rgba(0,0,0,0.5);
    z-index:20;
    text-transform:none;
    letter-spacing:0;
  }
  .legend-item:hover .tooltip, .legend-item.tap-active .tooltip{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .footer-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    margin-top:12px;
    font-size:11px;
    color:var(--lavender-dim);
  }
  #resetBtn{
    background:none;
    border:1px solid var(--panel-line);
    color:var(--lavender-dim);
    border-radius:8px;
    padding:5px 10px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
  }
  #resetBtn:hover{ color:var(--lavender); border-color:var(--lavender-dim); }

  #overlay{
    position:absolute;
    inset:0;
    background:rgba(8,10,22,0.88);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
    backdrop-filter: blur(2px);
    z-index:30;
  }
  #overlay.show{ display:flex; }
  #overlay h2{
    font-family:'Baloo 2', sans-serif;
    font-size:26px;
    color: var(--gold-soft);
    margin:0 0 6px;
  }
  #overlay .final-score{
    font-family:'Baloo 2', sans-serif;
    font-size:44px;
    font-weight:800;
    color:#fff;
    margin:6px 0;
    text-shadow:0 0 20px rgba(245,183,0,0.5);
  }
  #overlay .best{
    font-size:13px;
    color:var(--lavender-dim);
    margin-bottom:16px;
    font-weight:700;
  }
  #overlay .best span{ color: var(--gold-soft); }
  #playAgain{
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    border:none;
    color:#221a02;
    font-weight:800;
    font-family:'Baloo 2', sans-serif;
    font-size:16px;
    padding:10px 26px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(245,183,0,0.35);
  }
  #playAgain:active{ transform:translateY(1px); }
</style>
</head>
<body>

<div id="app">
  <h1>Pop Streak</h1>

  <div class="hud">
    <div class="hud-block">
      <div class="hud-label">Score</div>
      <div class="hud-value gold" id="scoreVal">0</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Turns Left</div>
      <div class="hud-value" id="turnsVal">30</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Best</div>
      <div class="hud-value" id="bestVal">0</div>
    </div>
  </div>

  <div id="board-wrap">
    <canvas id="game" width="380" height="560"></canvas>
    <div class="next-preview">
      <div>Next</div>
      <div class="next-dot" id="nextDot"></div>
    </div>
    <div id="overlay">
      <h2 id="overlayTitle">Game Over</h2>
      <div class="final-score" id="finalScore">0</div>
      <div class="best" id="bestLine">Best: <span id="bestInline">0</span></div>
      <button id="playAgain">Play Again</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="footer-row">
    <span>Aim with mouse / touch, tap to fire</span>
    <button id="resetBtn">Restart</button>
  </div>
</div>

<script>
(function(){
  // ---------- Config ----------
  const R = 19;
  const COLS_EVEN = 8;
  const BOARD_LEFT = 20;
  const TOP_Y = 30;
  const ROW_H = R * Math.sqrt(3);
  const MAX_ROWS = 13;
  const DANGER_ROW = 11;
  const TOTAL_TURNS = 30;
  const NEW_ROW_EVERY = 4;
  const BASE_POINTS = 10;
  const COMBO_GROWTH = 1.1;
  const SHOOTER_Y = 520;
  const SHOOTER_X = 190;
  const BUBBLE_SPEED = 9.5;

  const COLORS = {
    blue:   { top:'#8fc0ff', mid:'#3B82F6', dark:'#1e4fa8' },
    red:    { top:'#ff9aa8', mid:'#F4475E', dark:'#a01e33' },
    yellow: { top:'#ffe28a', mid:'#FFC93C', dark:'#b8860a' },
    green:  { top:'#8ff0cf', mid:'#34D399', dark:'#157a56' }
  };
  const COLOR_KEYS = Object.keys(COLORS);

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let grid = [];
  let turnsLeft = TOTAL_TURNS;
  let shotsFired = 0;
  let score = 0;
  let comboFloatTexts = [];
  let particles = [];
  let current = null;
  let nextColor = null;
  let flying = null;
  let aimAngle = -Math.PI/2;
  let gameOver = false;
  let animating = false;
  let dropAnim = [];

  const scoreEl = document.getElementById('scoreVal');
  const turnsEl = document.getElementById('turnsVal');
  const bestEl = document.getElementById('bestVal');
  const nextDot = document.getElementById('nextDot');
  const overlay = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('finalScore');
  const bestInlineEl = document.getElementById('bestInline');
  const overlayTitle = document.getElementById('overlayTitle');

  const HS_KEY = 'popStreak_highScore_v1';
  function getHighScore(){ return parseInt(localStorage.getItem(HS_KEY) || '0', 10); }
  function setHighScore(v){ localStorage.setItem(HS_KEY, String(v)); }
  bestEl.textContent = getHighScore();

  function colsInRow(row){ return (row % 2 === 0) ? COLS_EVEN : COLS_EVEN - 1; }

  function cellCenter(row, col){
    const y = TOP_Y + row * ROW_H;
    const x = (row % 2 === 0)
      ? BOARD_LEFT + R + col * 2 * R
      : BOARD_LEFT + 2 * R + col * 2 * R;
    return {x, y};
  }

  function neighborsOf(row, col){
    const even = row % 2 === 0;
    const list = even ? [
      [row, col-1],[row, col+1],
      [row-1, col-1],[row-1, col],
      [row+1, col-1],[row+1, col]
    ] : [
      [row, col-1],[row, col+1],
      [row-1, col],[row-1, col+1],
      [row+1, col],[row+1, col+1]
    ];
    return list.filter(([r,c]) => r>=0 && r<MAX_ROWS && c>=0 && c<colsInRow(r));
  }

  function makeEmptyGrid(){
    const g = [];
    for(let r=0;r<MAX_ROWS;r++){ g.push(new Array(colsInRow(r)).fill(null)); }
    return g;
  }

  function randomColor(){ return COLOR_KEYS[Math.floor(Math.random()*COLOR_KEYS.length)]; }

  function randomCellContent(){
    const roll = Math.random();
    let type = 'normal';
    if(roll < 0.06) type = 'bomb';
    else if(roll < 0.11) type = 'rainbow';
    else if(roll < 0.17) type = 'multiplier';
    return { color: randomColor(), type };
  }

  function fillInitialRows(numRows){
    for(let r=0;r<numRows;r++){
      for(let c=0;c<colsInRow(r);c++){
        grid[r][c] = randomCellContent();
      }
    }
  }

  function shiftGridDown(){
    const snapshot = [];
    for(let r=0;r<MAX_ROWS;r++){
      for(let c=0;c<colsInRow(r);c++){
        if(grid[r][c]) snapshot.push({...cellCenter(r,c), data: grid[r][c]});
      }
    }
    const newGrid = makeEmptyGrid();
    for(const item of snapshot){
      const targetY = item.y + ROW_H;
      const targetRow = Math.round((targetY - TOP_Y) / ROW_H);
      if(targetRow >= MAX_ROWS) continue;
      const nc = colsInRow(targetRow);
      const targetCol = (targetRow % 2 === 0)
        ? Math.round((item.x - BOARD_LEFT - R) / (2*R))
        : Math.round((item.x - BOARD_LEFT - 2*R) / (2*R));
      const clampedCol = Math.max(0, Math.min(nc-1, targetCol));
      newGrid[targetRow][clampedCol] = item.data;
    }
    for(let c=0;c<colsInRow(0);c++){
      newGrid[0][c] = randomCellContent();
    }
    grid = newGrid;
  }

  function isGridEmpty(){
    for(let r=0;r<MAX_ROWS;r++) for(let c=0;c<colsInRow(r);c++) if(grid[r][c]) return false;
    return true;
  }

  function highestOccupiedDangerRow(){
    for(let r=MAX_ROWS-1;r>=DANGER_ROW;r--){
      for(let c=0;c<colsInRow(r);c++) if(grid[r][c]) return true;
    }
    return false;
  }

  function initGame(){
    grid = makeEmptyGrid();
    fillInitialRows(6);
    turnsLeft = TOTAL_TURNS;
    shotsFired = 0;
    score = 0;
    particles = [];
    comboFloatTexts = [];
    dropAnim = [];
    flying = null;
    gameOver = false;
    animating = false;
    current = randomColor();
    nextColor = randomColor();
    updateHUD();
    overlay.classList.remove('show');
    updateNextDot();
  }

  function updateHUD(){
    scoreEl.textContent = Math.round(score);
    turnsEl.textContent = turnsLeft;
    turnsEl.classList.toggle('turns-low', turnsLeft <= 5);
    bestEl.textContent = getHighScore();
  }
  function updateNextDot(){
    const c = COLORS[nextColor];
    nextDot.style.background = `radial-gradient(circle at 35% 30%, ${c.top}, ${c.mid} 60%, ${c.dark})`;
  }

  function drawBubble(x, y, color, type, radius){
    radius = radius || R;
    const c = COLORS[color];
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI*2);
    const grad = ctx.createRadialGradient(x-radius*0.35, y-radius*0.4, radius*0.1, x, y, radius);
    grad.addColorStop(0, c.top);
    grad.addColorStop(0.55, c.mid);
    grad.addColorStop(1, c.dark);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(x-radius*0.32, y-radius*0.38, radius*0.32, radius*0.18, -0.6, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fill();

    if(type === 'bomb'){
      ctx.fillStyle = 'rgba(10,10,20,0.85)';
      ctx.beginPath(); ctx.arc(x, y+2, radius*0.32, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x, y-radius*0.15); ctx.lineTo(x+radius*0.28, y-radius*0.55); ctx.stroke();
    } else if(type === 'rainbow'){
      const stripes = ['#ff5a5a','#ffb84d','#ffe14d','#66e08a','#5ab8ff','#b98bff'];
      ctx.save();
      ctx.beginPath(); ctx.arc(x,y,radius*0.62,0,Math.PI*2); ctx.clip();
      const bandH = (radius*1.24)/stripes.length;
      stripes.forEach((s,i)=>{
        ctx.fillStyle = s;
        ctx.fillRect(x-radius*0.62, y-radius*0.62+i*bandH, radius*1.24, bandH+0.5);
      });
      ctx.restore();
    } else if(type === 'multiplier'){
      ctx.fillStyle = '#fff';
      ctx.font = `800 ${radius*1.05}px 'Baloo 2', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('★', x, y+1);
    }
    ctx.restore();
  }

  function drawGrid(){
    for(let r=0;r<MAX_ROWS;r++){
      for(let c=0;c<colsInRow(r);c++){
        const cell = grid[r][c];
        if(cell){
          const {x,y} = cellCenter(r,c);
          drawBubble(x,y,cell.color, cell.type);
        }
      }
    }
  }

  function drawShooter(){
    ctx.save();
    ctx.beginPath();
    ctx.arc(SHOOTER_X, SHOOTER_Y+18, 26, Math.PI, Math.PI*2);
    ctx.fillStyle = '#20265a';
    ctx.fill();
    ctx.strokeStyle = '#3a4290';
    ctx.lineWidth = 2;
    ctx.stroke();

    if(!animating && !gameOver){
      drawAimPreview();
    }

    ctx.translate(SHOOTER_X, SHOOTER_Y);
    ctx.rotate(aimAngle + Math.PI/2);
    ctx.fillStyle = '#2b3170';
    ctx.strokeStyle = '#4650a8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if(ctx.roundRect){ ctx.roundRect(-8, -36, 16, 30, 6); } else { ctx.rect(-8,-36,16,30); }
    ctx.fill(); ctx.stroke();
    ctx.restore();

    if(current) drawBubble(SHOOTER_X, SHOOTER_Y, current, 'normal', R+1);
  }

  function drawAimPreview(){
    let x = SHOOTER_X, y = SHOOTER_Y;
    let dx = Math.cos(aimAngle) * 8, dy = Math.sin(aimAngle) * 8;
    ctx.save();
    ctx.setLineDash([5,7]);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x,y);
    const boardW = COLS_EVEN * 2 * R;
    for(let i=0;i<60;i++){
      x += dx; y += dy;
      if(x - R < BOARD_LEFT){ x = BOARD_LEFT + R; dx = -dx; }
      if(x + R > BOARD_LEFT + boardW){ x = BOARD_LEFT + boardW - R; dx = -dx; }
      if(y < TOP_Y) break;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles(){
    particles.forEach(p=>{
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life/28);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.restore();
    });
  }

  function drawFloatTexts(){
    comboFloatTexts.forEach(t=>{
      ctx.save();
      ctx.globalAlpha = Math.max(0, t.life/50);
      ctx.font = `800 ${t.size}px 'Baloo 2', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
    });
  }

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    if(flying) drawBubble(flying.x, flying.y, flying.color, flying.type);
    dropAnim.forEach(b=> drawBubble(b.x, b.y, b.color, b.type));
    drawParticles();
    drawFloatTexts();
    drawShooter();
  }

  function findMatchGroup(row, col){
    const target = grid[row][col];
    if(!target) return [];
    const targetColor = target.type === 'rainbow' ? null : target.color;
    const visited = new Set();
    const stack = [[row,col]];
    const group = [];
    visited.add(row+','+col);
    while(stack.length){
      const [r,c] = stack.pop();
      group.push([r,c]);
      for(const [nr,nc] of neighborsOf(r,c)){
        const key = nr+','+nc;
        if(visited.has(key)) continue;
        const cell = grid[nr][nc];
        if(!cell) continue;
        const matches = cell.type === 'rainbow' || targetColor === null || cell.color === targetColor;
        if(matches){
          visited.add(key);
          stack.push([nr,nc]);
        }
      }
    }
    return group;
  }

  function findFloatingBubbles(){
    const connected = new Set();
    const queue = [];
    for(let c=0;c<colsInRow(0);c++){
      if(grid[0][c]){ connected.add('0,'+c); queue.push([0,c]); }
    }
    while(queue.length){
      const [r,c] = queue.shift();
      for(const [nr,nc] of neighborsOf(r,c)){
        const key = nr+','+nc;
        if(connected.has(key)) continue;
        if(grid[nr][nc]){ connected.add(key); queue.push([nr,nc]); }
      }
    }
    const floating = [];
    for(let r=0;r<MAX_ROWS;r++){
      for(let c=0;c<colsInRow(r);c++){
        if(grid[r][c] && !connected.has(r+','+c)) floating.push([r,c]);
      }
    }
    return floating;
  }

  function spawnPopParticles(x,y,colorKey){
    const c = COLORS[colorKey] ? COLORS[colorKey].mid : '#ffffff';
    for(let i=0;i<7;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 1.5 + Math.random()*3;
      particles.push({x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:28, r:2+Math.random()*2, color:c});
    }
  }

  function resolveMatch(row, col){
    const group = findMatchGroup(row, col);
    if(group.length < 3){
      return;
    }
    let poppedSet = new Set(group.map(([r,c])=>r+','+c));
    let hasMultiplier = false;

    const bombCells = group.filter(([r,c]) => grid[r][c] && grid[r][c].type === 'bomb');
    bombCells.forEach(([r,c])=>{
      neighborsOf(r,c).forEach(([nr,nc])=>{
        if(grid[nr][nc]) poppedSet.add(nr+','+nc);
      });
      neighborsOf(r,c).forEach(([nr,nc])=>{
        neighborsOf(nr,nc).forEach(([nr2,nc2])=>{
          if(grid[nr2][nc2]) poppedSet.add(nr2+','+nc2);
        });
      });
    });

    poppedSet.forEach(key=>{
      const [r,c] = key.split(',').map(Number);
      if(grid[r][c] && grid[r][c].type === 'multiplier') hasMultiplier = true;
    });

    poppedSet.forEach(key=>{
      const [r,c] = key.split(',').map(Number);
      const cell = grid[r][c];
      if(cell){
        const {x,y} = cellCenter(r,c);
        spawnPopParticles(x,y,cell.color);
      }
      grid[r][c] = null;
    });

    const floating = findFloatingBubbles();
    floating.forEach(([r,c])=>{
      const cell = grid[r][c];
      if(cell){
        const {x,y} = cellCenter(r,c);
        dropAnim.push({x,y,vy:2, color:cell.color, type:cell.type});
        poppedSet.add(r+','+c);
        if(cell.type === 'multiplier') hasMultiplier = true;
      }
      grid[r][c] = null;
    });

    const N = poppedSet.size;
    let turnScore = 0;
    for(let i=0;i<N;i++){
      turnScore += BASE_POINTS * Math.pow(COMBO_GROWTH, i);
    }
    if(hasMultiplier) turnScore *= 2;
    turnScore = Math.round(turnScore);
    score += turnScore;

    const {x:fx,y:fy} = cellCenter(row,col);
    let label = N + ' popped  +' + turnScore;
    if(N >= 8) label = 'MEGA COMBO x' + N + '!  +' + turnScore;
    else if(N >= 5) label = 'COMBO x' + N + '!  +' + turnScore;
    if(hasMultiplier) label += '  ★x2';
    comboFloatTexts.push({x:fx, y:fy, text:label, life:50, size: N>=8?18:14, color: hasMultiplier? '#FFD866':'#ffffff'});
  }

  function snapToGrid(x, y){
    let bestRow = Math.round((y - TOP_Y) / ROW_H);
    bestRow = Math.max(0, Math.min(MAX_ROWS-1, bestRow));
    let candidates = [];
    for(let dr=-1; dr<=1; dr++){
      const row = bestRow + dr;
      if(row < 0 || row >= MAX_ROWS) continue;
      const nc = colsInRow(row);
      let col = (row % 2 === 0)
        ? Math.round((x - BOARD_LEFT - R) / (2*R))
        : Math.round((x - BOARD_LEFT - 2*R) / (2*R));
      for(let dc=-1; dc<=1; dc++){
        const cc = col+dc;
        if(cc>=0 && cc<nc) candidates.push([row,cc]);
      }
    }
    let best = null, bestDist = Infinity;
    candidates.forEach(([r,c])=>{
      if(grid[r][c]) return;
      const {x:cx,y:cy} = cellCenter(r,c);
      const d = (cx-x)*(cx-x) + (cy-y)*(cy-y);
      if(d < bestDist){ bestDist = d; best = [r,c]; }
    });
    if(!best){
      for(let r=0;r<MAX_ROWS;r++){
        for(let c=0;c<colsInRow(r);c++){
          if(grid[r][c]) continue;
          const {x:cx,y:cy} = cellCenter(r,c);
          const d = (cx-x)*(cx-x) + (cy-y)*(cy-y);
          if(d<bestDist){ bestDist=d; best=[r,c]; }
        }
      }
    }
    return best;
  }

  function fire(){
    if(animating || gameOver || !current) return;
    let angle = aimAngle;
    const minA = -Math.PI + 0.18, maxA = -0.18;
    if(angle < minA) angle = minA;
    if(angle > maxA) angle = maxA;

    flying = {
      x: SHOOTER_X, y: SHOOTER_Y,
      dx: Math.cos(angle) * BUBBLE_SPEED,
      dy: Math.sin(angle) * BUBBLE_SPEED,
      color: current,
      type: 'normal'
    };
    animating = true;
    current = nextColor;
    nextColor = randomColor();
    updateNextDot();
  }

  function stepFlying(){
    if(!flying) return;
    flying.x += flying.dx;
    flying.y += flying.dy;
    const boardW = COLS_EVEN * 2 * R;
    if(flying.x - R < BOARD_LEFT){ flying.x = BOARD_LEFT + R; flying.dx *= -1; }
    if(flying.x + R > BOARD_LEFT + boardW){ flying.x = BOARD_LEFT + boardW - R; flying.dx *= -1; }

    let collided = flying.y - R <= TOP_Y - R*0.4;
    if(!collided){
      outer:
      for(let r=0;r<MAX_ROWS;r++){
        for(let c=0;c<colsInRow(r);c++){
          const cell = grid[r][c];
          if(!cell) continue;
          const {x,y} = cellCenter(r,c);
          const dist2 = (x-flying.x)*(x-flying.x) + (y-flying.y)*(y-flying.y);
          if(dist2 < (2*R*0.92)*(2*R*0.92)){ collided = true; break outer; }
        }
      }
    }

    if(collided){
      const spot = snapToGrid(flying.x, flying.y);
      if(spot){
        const [r,c] = spot;
        grid[r][c] = { color: flying.color, type: 'normal' };
        flying = null;
        finishTurn(r,c);
      } else {
        flying = null;
        finishTurn(null,null);
      }
    }
  }

  function finishTurn(r,c){
    if(r !== null) resolveMatch(r,c);
    shotsFired++;
    turnsLeft--;
    updateHUD();

    if(shotsFired % NEW_ROW_EVERY === 0 && turnsLeft > 0){
      shiftGridDown();
    }

    setTimeout(()=>{
      animating = false;
      checkEndConditions();
    }, 260);
  }

  function checkEndConditions(){
    if(gameOver) return;
    if(isGridEmpty()){
      score += 500;
      endGame('Board Cleared!');
      return;
    }
    if(highestOccupiedDangerRow()){
      endGame('Bubbles Reached the Bottom!');
      return;
    }
    if(turnsLeft <= 0){
      endGame('Out of Turns!');
      return;
    }
  }

  function endGame(reason){
    gameOver = true;
    updateHUD();
    const hs = getHighScore();
    const finalScore = Math.round(score);
    if(finalScore > hs){ setHighScore(finalScore); }
    overlayTitle.textContent = reason;
    finalScoreEl.textContent = finalScore;
    bestInlineEl.textContent = getHighScore();
    bestEl.textContent = getHighScore();
    overlay.classList.add('show');
  }

  function tick(){
    if(flying) stepFlying();

    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy += 0.08; p.life--; });
    particles = particles.filter(p=>p.life>0);

    comboFloatTexts.forEach(t=>{ t.y -= 0.4; t.life--; });
    comboFloatTexts = comboFloatTexts.filter(t=>t.life>0);

    dropAnim.forEach(b=>{ b.y += b.vy; b.vy += 0.5; });
    dropAnim = dropAnim.filter(b=> b.y < canvas.height + 30);

    render();
    requestAnimationFrame(tick);
  }

  function angleFromEvent(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;
    return Math.atan2(y - SHOOTER_Y, x - SHOOTER_X);
  }

  canvas.addEventListener('mousemove', (e)=>{
    aimAngle = angleFromEvent(e.clientX, e.clientY);
  });
  canvas.addEventListener('click', (e)=>{
    aimAngle = angleFromEvent(e.clientX, e.clientY);
    fire();
  });
  canvas.addEventListener('touchstart', (e)=>{
    const t = e.touches[0];
    aimAngle = angleFromEvent(t.clientX, t.clientY);
  }, {passive:true});
  canvas.addEventListener('touchmove', (e)=>{
    const t = e.touches[0];
    aimAngle = angleFromEvent(t.clientX, t.clientY);
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchend', (e)=>{
    fire();
  });

  document.getElementById('resetBtn').addEventListener('click', initGame);
  document.getElementById('playAgain').addEventListener('click', initGame);

  const legendData = [
    { icon:'💣', label:'Bomb', color:'#F4475E', tip:'Pop a bomb bubble in a match and it blasts nearby bubbles too, regardless of color.' },
    { icon:'🌈', label:'Rainbow', color:'#34D399', tip:'Rainbow bubbles connect to any color, helping link up bigger groups.' },
    { icon:'★', label:'Star', color:'#FFC93C', tip:'Pop a star bubble in a match and it doubles your entire score for that turn.' }
  ];
  const legendEl = document.getElementById('legend');
  legendData.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = `<span class="legend-orb" style="background:radial-gradient(circle at 35% 30%, #fff2, ${item.color})">${item.icon}</span>${item.label}<div class="tooltip">${item.tip}</div>`;
    div.addEventListener('click', ()=>{ div.classList.toggle('tap-active'); });
    legendEl.appendChild(div);
  });

  initGame();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
