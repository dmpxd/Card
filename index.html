<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Combo Bubble Shooter</title>

<style>

body{
    background:#181818;
    color:white;
    font-family:Arial;
    text-align:center;
}

canvas{
    background:#222;
    border-radius:12px;
    border:2px solid #444;
}

.ui{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-bottom:10px;
}

.badge{
    display:inline-block;
    width:18px;
    height:18px;
    border-radius:50%;
    cursor:pointer;
    position:relative;
}

.tooltip{
    position:absolute;
    bottom:30px;
    left:-40px;

    background:#333;
    padding:8px;
    border-radius:6px;

    width:140px;

    opacity:0;
    pointer-events:none;

    transition:0.2s;
}

.badge:hover .tooltip{
    opacity:1;
}

</style>
</head>

<body>

<h1>Bubble Combo</h1>

<div class="ui">

<div>Score: <span id="score">0</span></div>

<div>Turns: <span id="turns">30</span></div>

<div>
Highscore:
<span id="highscore"></span>
</div>

</div>


<div>

<div class="badge" style="background:gold">

<div class="tooltip">
Bomb bubble<br>
Removes nearby bubbles
</div>

</div>


<div class="badge" style="background:violet">

<div class="tooltip">
Rainbow bubble<br>
Matches any color
</div>

</div>

<div class="badge" style="background:white">

<div class="tooltip">
Lightning bubble<br>
Deletes a whole row
</div>

</div>

</div>

<br>

<canvas id="game"
width="700"
height="800"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const R = 22;

const colors =
[
"red",
"blue",
"green",
"yellow"
];

let turns=30;

let score=0;

let nextColor=randomColor();

let board=[];

const rows=10;
const cols=14;

const shooter =
{
x:350,
y:740
};

const hs =
localStorage.getItem("bubbleHS")||0;

document.getElementById("highscore")
.innerText=hs;


function randomColor(){

return colors[
Math.floor(
Math.random()*4
)
];

}


function init(){

for(let r=0;r<rows;r++){

board[r]=[];

for(let c=0;c<cols;c++){

if(r<6){

let bubble={

color:randomColor(),

special:null

};

if(Math.random()<0.05)
bubble.special="bomb";

if(Math.random()<0.03)
bubble.special="rainbow";

if(Math.random()<0.03)
bubble.special="lightning";

board[r][c]=bubble;

}
else{

board[r][c]=null;

}

}

}

}

init();


function draw(){

ctx.clearRect(
0,
0,
700,
800
);

for(let r=0;r<rows;r++){

for(let c=0;c<cols;c++){

const b=board[r][c];

if(!b) continue;

let x =
c*45+40;

let y =
r*42+40;

ctx.beginPath();

ctx.arc(
x,
y,
R,
0,
Math.PI*2
);

ctx.fillStyle=
b.color;

ctx.fill();

if(b.special){

ctx.fillStyle="white";

ctx.font="16px Arial";

ctx.fillText(
"*",
x-4,
y+5
);

}

}

}

ctx.beginPath();

ctx.arc(

shooter.x,

shooter.y,

R,

0,

Math.PI*2

);

ctx.fillStyle=
nextColor;

ctx.fill();

requestAnimationFrame(draw);

}

draw();



canvas.onclick=e=>{

if(turns<=0)
return;

let rect=
canvas.getBoundingClientRect();

let mx=
e.clientX-
rect.left;

let col=
Math.floor(mx/45);

if(col<0) col=0;
if(col>=cols) col=cols-1;

for(let r=rows-1;r>=0;r--){

if(board[r][col]==null){

board[r][col]={

color:nextColor,
special:null

};

resolve(r,col);

turns--;

document
.getElementById(
"turns"
).innerText=turns;

nextColor=
randomColor();

checkEnd();

break;

}

}

};


function resolve(r,c){

const target=
board[r][c];

if(!target) return;

const color=
target.color;

let stack=
[[r,c]];

let visited={};

let found=[];

while(stack.length){

const [rr,cc]=
stack.pop();

const k=
rr+"_"+cc;

if(visited[k])
continue;

visited[k]=1;

const b=
board[rr]?.[cc];

if(!b)
continue;

if(
b.color!==color &&
b.special!=="rainbow"
)
continue;

found.push([rr,cc]);

[
[1,0],
[-1,0],
[0,1],
[0,-1]

]

.forEach(d=>{

stack.push(

[
rr+d[0],
cc+d[1]

]

);

});

}

if(found.length>=3){

let mult=1;

for(let i=0;i<found.length;i++){

score +=
Math.floor(
10*mult
);

mult*=1.1;

}

found.forEach(p=>{

let b=
board[p[0]][p[1]];

if(b.special==="bomb"){

explode(
p[0],
p[1]
);

}

else if(
b.special==="lightning"
){

zapRow(
p[0]
);

}

board[
p[0]
][
p[1]
]=null;

});

document
.getElementById(
"score"
)
.innerText=
score;

saveHS();

}

}


function explode(r,c){

for(let rr=r-1;
rr<=r+1;
rr++){

for(let cc=c-1;
cc<=c+1;
cc++){

if(
board[rr]
)

board[rr][cc]=null;

}

}

}


function zapRow(r){

for(let c=0;
c<cols;
c++){

board[r][c]=null;

}

}


function saveHS(){

let h=
Number(
localStorage.getItem(
"bubbleHS"
)||0);

if(score>h){

localStorage.setItem(
"bubbleHS",
score
);

document
.getElementById(
"highscore"
)
.innerText=
score;

}

}


function checkEnd(){

if(turns<=0){

alert(

"Game Over\nScore: "+score

);

}

}

</script>

</body>

</html>
